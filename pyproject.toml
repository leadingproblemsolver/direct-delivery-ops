[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "direct-delivery-ops"
version = "1.0.0"
description = "Approval-gated workspace initializer and validator for source-linked direct-delivery market validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
direct-delivery = "direct_delivery_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
